# ==============================================================================
# Render.com Deployment Blueprint (render.yaml)
# MeplanIQ - AI-Powered Architectural & MEP CAD/BIM Engine
# ==============================================================================
services:
  # FastAPI Python Backend Web Service (Free Tier)
  - type: web
    name: meplaniq-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
