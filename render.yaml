# ==============================================================================
# Render.com Deployment Blueprint (render.yaml)
# MeplanIQ - AI-Powered Architectural & MEP CAD/BIM Engine
# ==============================================================================
services:
  # 1. FastAPI Python Backend Service
  - type: web
    name: meplaniq-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000

  # 2. Vite React Frontend Static Site
  - type: static
    name: meplaniq-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: meplaniq-backend
          property: host
